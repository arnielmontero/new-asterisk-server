; Rendered by docker-entrypoint.sh into /run/asterisk/etc/asterisk.conf.
; The entrypoint drops privileges with setpriv, so no runuser/rungroup here.

[directories]
astetcdir => /run/asterisk/etc
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
timestamp = yes
documentation_language = en_US
transmit_silence = yes
; Control socket is only reachable by the asterisk user and root (healthcheck).
[files]
astctlpermissions = 0660
