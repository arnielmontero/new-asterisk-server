; AMI is used only by the backend container. Bound on all interfaces because
; the backend reaches it via the Docker host gateway; access is limited by the
; ACL below and must also be restricted by the host firewall (DEPLOYMENT.md).
[general]
enabled = yes
port = ${AMI_PORT}
bindaddr = 0.0.0.0
webenabled = no
allowmultiplelogin = yes
displayconnects = no
authtimeout = 30
authlimit = 5

[${AMI_USER}]
secret = ${AMI_PASS}
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
permit = ${AMI_PERMIT}
; Least privilege. Requested set was system,call,log,verbose,command,agent,
; user,config,originate. Dropped: log, verbose, agent, config. Kept:
;   system    ContactStatus events, DBPut/DBDel (single-use page authorisation)
;   call      DeviceStateChange / Newchannel / Hangup / DialEnd, Hangup action
;   user      dialplan UserEvents (PageStarted / PageEnded / PageDenied)
;   command   read-only "core show ..." probes for the admin status page
;   originate click-to-call between configured extensions
read = system,call,user
write = system,call,command,originate
eventfilter = !Event: RTCP*
eventfilter = !Event: VarSet
eventfilter = !Event: Newexten
