; Call parking. A person transfers a caller to 750 (the Park button on the dashboard, or the transfer key of a phone); the
; caller waits in one of the slots 751-759 and anybody can pick them up by dialling the slot number. A call nobody picks up
; within two minutes rings back the person who parked it. No sound files are installed, so nothing is announced: the
; dashboard shows the slot ("Parked calls"), and the waiting caller hears silence.
[general]

[default]
context = parkedcalls
parkext = 750
parkext_exclusive = no
parkpos = 751-759
parkinghints = yes
parkingtime = 120
comebacktoorigin = yes
findslot = first
parkedplay = no
parkedcalltransfers = no
parkedcallreparking = no
parkedcallhangup = no
parkedcallrecording = no
