; Call detail records. cdr_manager publishes every finished record as an AMI "Cdr" event; the backend stores
; them in PostgreSQL (table cdr) and serves them in the web UI. Nothing is written to files.
[general]
enable = yes
; Record calls nobody answered and calls that ended in congestion: missed calls matter.
unanswered = yes
congestion = yes
; Do not wait for the batch interval: the UI should show a call as soon as it ends.
batch = no
endbeforehexten = no
initiatedseconds = no
