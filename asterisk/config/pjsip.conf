; PJSIP configuration template (Asterisk 22.11.0). ${VARS} are rendered by
; docker-entrypoint.sh. There is deliberately NO anonymous endpoint and no guest
; access: every request must either authenticate as a named endpoint or come from
; the configured address of a trunk (the generated [identify] sections). (chan_sip's
; allow_guest=no has no PJSIP option; the PJSIP equivalent is not defining an
; "anonymous" endpoint.)

[global]
type = global
user_agent = LAN-Comms-PBX
; ip: trunks are recognised by the addresses listed in their [identify] sections only (generated).
endpoint_identifier_order = ip,username,auth_username

; ----------------------------------------------------------------- transports
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; TCP signalling, used by trunks that need it (UDP stays the default).
[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; WebSocket SIP transport. Browser WSS terminates at Nginx, which proxies plain
; WS to the Asterisk HTTP server (http.conf, :8088/ws).
[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0

; ------------------------------------------------------------------ templates
[ep-common](!)
type = endpoint
context = default
disallow = all
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
allow_transfer = no
language = en
; A browser tab that crashes or a phone that loses power never sends BYE. Hang the call
; up when no RTP arrives for 30 s, otherwise the channel (and a page) would stay "up"
; until the session timer expires (30 min).
rtp_timeout = 30
rtp_timeout_hold = 0
deny = 0.0.0.0/0

; Browser WebRTC client (DTLS-SRTP, ICE, AVPF, rtcp-mux).
[ep-webrtc](!,ep-common)
transport = transport-ws
allow = opus
allow = ulaw
allow = alaw
webrtc = yes
media_encryption = dtls
dtls_verify = fingerprint
dtls_setup = actpass
dtls_auto_generate_cert = no
dtls_cert_file = /run/asterisk/keys/asterisk_dtls.pem
dtls_private_key = /run/asterisk/keys/asterisk_dtls.key
use_avpf = yes
ice_support = yes
rtcp_mux = yes
media_use_received_transport = yes
; Browser signalling reaches Asterisk from the Nginx proxy, not the LAN client.
permit = 127.0.0.1/32
permit = ${PROXY_PERMIT}

; Physical SIP/IP phone over UDP, plain RTP.
[ep-phone](!,ep-common)
transport = transport-udp
allow = ulaw
allow = alaw
media_encryption = no
use_avpf = no
ice_support = no
dtmf_mode = rfc4733
permit = ${LAN_SUBNET}

[aor-common](!)
type = aor
max_contacts = 1
remove_existing = yes
remove_unavailable = yes
minimum_expiration = 60
default_expiration = 300
maximum_expiration = 3600
; OPTIONS keepalive: produces real ContactStatus Reachable/Unreachable events.
qualify_frequency = 30
qualify_timeout = 5

[auth-common](!)
type = auth
auth_type = userpass

; SIP trunk (provider, another PBX, or a gateway). Reachable only from the addresses in its generated
; [identify] section; it gets its own dialplan context so inbound calls can only reach inbound routes.
[ep-trunk](!)
type = endpoint
disallow = all
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
media_encryption = no
use_avpf = no
ice_support = no
allow_transfer = no
language = en
rtp_timeout = 60
rtp_timeout_hold = 0
trust_id_inbound = no
send_pai = no

[aor-trunk](!)
type = aor
max_contacts = 1
minimum_expiration = 60
qualify_timeout = 5

; ------------------------------------------------------------- generated objects
; Extensions and trunks are managed in the web UI, stored in PostgreSQL and rendered by the backend into
; this file (shared volume); the backend then asks Asterisk to reload. Never edit it by hand.
#include "/pbx-generated/pjsip_generated.conf"
