; PJSIP configuration template (Asterisk 22.11.0). ${VARS} are rendered by
; docker-entrypoint.sh. There is deliberately NO anonymous endpoint, no
; "identify" section and no guest access: every request must authenticate as a
; named endpoint. (chan_sip's allow_guest=no has no PJSIP option; the PJSIP
; equivalent is not defining an "anonymous" endpoint.)

[global]
type = global
user_agent = LAN-Comms-PBX
endpoint_identifier_order = username,auth_username

; ----------------------------------------------------------------- transports
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; WebSocket SIP transport. Browser WSS terminates at Nginx, which proxies plain
; WS to the Asterisk HTTP server (http.conf, :8088/ws).
[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0

; ------------------------------------------------------------------ templates
[ep-common](!)
type = endpoint
context = default
disallow = all
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
allow_transfer = no
language = en
deny = 0.0.0.0/0

; Browser WebRTC client (DTLS-SRTP, ICE, AVPF, rtcp-mux).
[ep-webrtc](!,ep-common)
transport = transport-ws
allow = opus
allow = ulaw
allow = alaw
webrtc = yes
media_encryption = dtls
dtls_verify = fingerprint
dtls_setup = actpass
dtls_auto_generate_cert = no
dtls_cert_file = /run/asterisk/keys/asterisk_dtls.pem
dtls_private_key = /run/asterisk/keys/asterisk_dtls.key
use_avpf = yes
ice_support = yes
rtcp_mux = yes
media_use_received_transport = yes
; Browser signalling reaches Asterisk from the Nginx proxy, not the LAN client.
permit = 127.0.0.1/32
permit = ${PROXY_PERMIT}

; Physical SIP/IP phone over UDP, plain RTP.
[ep-phone](!,ep-common)
transport = transport-udp
allow = ulaw
allow = alaw
media_encryption = no
use_avpf = no
ice_support = no
dtmf_mode = rfc4733
permit = ${LAN_SUBNET}

[aor-common](!)
type = aor
max_contacts = 1
remove_existing = yes
remove_unavailable = yes
minimum_expiration = 60
default_expiration = 300
maximum_expiration = 3600
; OPTIONS keepalive: produces real ContactStatus Reachable/Unreachable events.
qualify_frequency = 30
qualify_timeout = 5

[auth-common](!)
type = auth
auth_type = userpass

; ------------------------------------------------- 1001 Office (browser)
[1001](ep-webrtc)
aors = 1001
auth = 1001-auth
callerid = "Office" <1001>

[1001](aor-common)

[1001-auth](auth-common)
username = 1001
password = ${EXT_1001_PASSWORD}

; ----------------------------------------------- 1002 Warehouse (browser)
[1002](ep-webrtc)
aors = 1002
auth = 1002-auth
callerid = "Warehouse" <1002>

[1002](aor-common)

[1002-auth](auth-common)
username = 1002
password = ${EXT_1002_PASSWORD}

; ---------------------------- 1001 Office (physical phone: user 1001-phone)
[1001-phone](ep-phone)
aors = 1001-phone
auth = 1001-phone-auth
callerid = "Office" <1001>

[1001-phone](aor-common)

[1001-phone-auth](auth-common)
username = 1001-phone
password = ${EXT_1001_PHONE_PASSWORD}

; ------------------------ 1002 Warehouse (physical phone: user 1002-phone)
[1002-phone](ep-phone)
aors = 1002-phone
auth = 1002-phone-auth
callerid = "Warehouse" <1002>

[1002-phone](aor-common)

[1002-phone-auth](auth-common)
username = 1002-phone
password = ${EXT_1002_PHONE_PASSWORD}
