; Call queues. Queues, their members and their settings are managed in the web UI, stored in PostgreSQL and rendered
; by the backend into the included file (shared volume). Membership is static (the members of a queue are its
; configured extensions); agents can pause themselves, which is runtime state kept by Asterisk.
[general]
persistentmembers = no
autofill = yes
shared_lastcall = yes
monitor-type = no

#include "/pbx-generated/queues_generated.conf"
