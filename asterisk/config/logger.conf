[general]
dateformat = %F %T.%3q
use_callids = yes
appendhostname = no
queue_log = no

[logfiles]
; console goes to the container's stdout (docker compose logs asterisk)
console => notice,warning,error,security
messages.log => notice,warning,error
security.log => security
; full.log is verbose and contains SIP/dialplan activity; credentials are never
; logged by Asterisk at these levels but treat the file as sensitive.
full.log => notice,warning,error,verbose,dtmf
