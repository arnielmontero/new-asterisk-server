; Dialplan for Asterisk 22.11.0. Only the fixed extensions below are routable;
; anything else is rejected. Caller ID is set by the authenticated endpoint
; (pjsip.conf), never taken from the SIP From header.

[general]
static = yes
writeprotect = no
clearglobalvars = no

[globals]

; Ring an extension's browser and physical-phone endpoints in parallel.
; ARG1 = extension. Calls are manual-answer (no auto-answer options).
[sub-dial-ext]
exten => s,1,NoOp(Call ${CALLERID(num)} -> ${ARG1})
 same => n,GotoIf($["${CALLERID(num)}" = "${ARG1}"]?self)
 same => n,Dial(PJSIP/${ARG1}&PJSIP/${ARG1}-phone,30)
 same => n,Hangup()
 same => n(self),NoOp(Self-call rejected for ${ARG1})
 same => n,Congestion(3)

[default]
; Echo test
exten => 600,1,NoOp(Echo test from ${CALLERID(num)})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; 1001 Office
exten => 1001,1,Gosub(sub-dial-ext,s,1(1001))
 same => n,Hangup()

; 1002 Warehouse
exten => 1002,1,Gosub(sub-dial-ext,s,1(1002))
 same => n,Hangup()

; Invalid extension
exten => i,1,NoOp(Invalid destination ${INVALID_EXTEN} from ${CALLERID(num)})
 same => n,Hangup(1)

; Timeout / hangup handlers
exten => t,1,Hangup()
exten => h,1,NoOp(Call ended)
