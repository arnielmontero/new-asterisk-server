; Dialplan for Asterisk 22.11.0. The routable numbers (extensions, paging groups, outbound routes, inbound
; routes per trunk) are managed in the web UI and generated into extensions_generated.conf, which is included
; at the bottom of this file. Anything not defined there is rejected. Caller ID is set by the authenticated
; endpoint (pjsip.conf), never taken from the SIP From header.

[general]
static = yes
writeprotect = no
clearglobalvars = no

[globals]

; --------------------------------------------------------------- normal calls
; Ring an extension's browser and physical-phone endpoints in parallel.
; ARG1 = extension. Calls are manual-answer (no auto-answer options).
; Per-extension handling comes from the generated [ext-settings] context: do not disturb (X_DND), forward
; always (X_FWD_ALL), forward when busy (X_FWD_BUSY), forward when unanswered/unreachable (X_FWD_NA) and the ring
; time (X_NA_SECS). The forward variables hold the name of a destination context (dst-...). FWD_DEPTH stops
; forwarding loops (A forwards to B forwards to A).
[sub-dial-ext]
exten => s,1,NoOp(Call ${CALLERID(num)} -> ${ARG1})
 same => n,GotoIf($["${CALLERID(num)}" = "${ARG1}"]?self)
 same => n,Set(FWD_DEPTH=$[0${FWD_DEPTH} + 1])
 same => n,GotoIf($[${FWD_DEPTH} > 5]?loop)
 same => n,Set(X_DND=0)
 same => n,Set(X_FWD_ALL=)
 same => n,Set(X_FWD_BUSY=)
 same => n,Set(X_FWD_NA=)
 same => n,Set(X_NA_SECS=30)
 same => n,GotoIf($[${DIALPLAN_EXISTS(ext-settings,${ARG1},1)}]?load:go)
 same => n(load),Gosub(ext-settings,${ARG1},1)
 same => n(go),GotoIf($["${X_FWD_ALL}" != ""]?fwdall)
 same => n,GotoIf($["${X_DND}" = "1"]?busy)
 same => n,Gosub(sub-dialstr,s,1(${ARG1}))
 same => n,GotoIf($["${DIALSTR}" = ""]?unavailable)
 same => n,Dial(${DIALSTR},${X_NA_SECS})
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER" | "${DIALSTATUS}" = "CANCEL"]?done)
 same => n,Goto(noanswer)
 same => n(done),Hangup()
 same => n(unavailable),NoOp(${ARG1} has no reachable client)
 same => n,GotoIf($["${X_FWD_NA}" != ""]?fwdna)
 same => n,Hangup(20)
 same => n(noanswer),GotoIf($["${X_FWD_NA}" != ""]?fwdna)
 same => n,Hangup()
 same => n(busy),GotoIf($["${X_FWD_BUSY}" != ""]?fwdbusy)
 same => n,Busy(10)
 same => n,Hangup(17)
 same => n(fwdall),NoOp(${ARG1} forwards all calls)
 same => n,Goto(${X_FWD_ALL},s,1)
 same => n(fwdbusy),Goto(${X_FWD_BUSY},s,1)
 same => n(fwdna),Goto(${X_FWD_NA},s,1)
 same => n(loop),NoOp(Forwarding loop detected at ${ARG1})
 same => n,Congestion(3)
 same => n(self),NoOp(Self-call rejected for ${ARG1})
 same => n,Congestion(3)

; Cut off call-flow loops (time condition -> time condition -> ...): every generated destination context calls this.
[sub-hop]
exten => s,1,Set(HOPS=$[0${HOPS} + 1])
 same => n,ExecIf($[${HOPS} > 25]?Hangup(34))
 same => n,Return()

; Add extension ARG1's reachable devices to RG_TARGETS (ring groups), skipping the caller and anyone on do not disturb.
[sub-rg-add]
exten => s,1,ExecIf($["${ARG1}" = "${CALLERID(num)}"]?Return())
 same => n,Gosub(sub-dialstr,s,1(${ARG1},1))
 same => n,ExecIf($["${DIALSTR}" = ""]?Return())
 same => n,Set(RG_TARGETS=${IF($["${RG_TARGETS}" = ""]?:${RG_TARGETS}&)}${DIALSTR})
 same => n,Return()

; Build DIALSTR from the endpoints of extension ARG1 that are reachable right now
; (browser "1001" and/or physical phone "1001-phone"). Dialling an endpoint with no
; registered contact only produces errors, so unreachable ones are left out.
; ARG2 = 1 also leaves out an extension that is on do not disturb (ring groups); paging and click-to-call do not.
[sub-dialstr]
exten => s,1,Set(DIALSTR=)
 same => n,GotoIf($["${ARG2}" != "1"]?devs)
 same => n,Set(X_DND=0)
 same => n,GotoIf($[${DIALPLAN_EXISTS(ext-settings,${ARG1},1)}]?:devs)
 same => n,Gosub(ext-settings,${ARG1},1)
 same => n,GotoIf($["${X_DND}" = "1"]?done)
 same => n(devs),GotoIf($["${DEVICE_STATE(PJSIP/${ARG1})}" = "UNAVAILABLE" | "${DEVICE_STATE(PJSIP/${ARG1})}" = "INVALID"]?phone)
 same => n,Set(DIALSTR=PJSIP/${ARG1})
 same => n(phone),GotoIf($["${DEVICE_STATE(PJSIP/${ARG1}-phone)}" = "UNAVAILABLE" | "${DEVICE_STATE(PJSIP/${ARG1}-phone)}" = "INVALID"]?done)
 same => n,Set(DIALSTR=${IF($["${DIALSTR}" = ""]?:${DIALSTR}&)}PJSIP/${ARG1}-phone)
 same => n(done),Return()

; First leg of a click-to-call (AMI Originate from the backend): ring the
; originating extension; once answered, Originate continues in [default].
[originate-leg]
exten => _[0-9].,1,NoOp(Originate leg: ringing ${EXTEN})
 same => n,Gosub(sub-dialstr,s,1(${EXTEN}))
 same => n,GotoIf($["${DIALSTR}" = ""]?unavailable)
 same => n,Dial(${DIALSTR},30)
 same => n,Hangup()
 same => n(unavailable),Hangup(20)

; --------------------------------------------------------------------- paging
; One-way live paging. The operator's own browser places a normal SIP call to
; 700/701/702 with their microphone; Page() bridges that audio to the targets
; as muted conference participants (no "d" option => recipients cannot talk back).
;
; A page is only allowed when the backend has first authorised it: it writes
; AstDB page_auth/<extension> = "<group>:<expiry epoch>" over AMI after checking
; the user's JWT, role and group. The record is consumed here (single use).
[sub-page]
exten => s,1,NoOp(Page ${ARG1} requested by ${CALLERID(num)})
 same => n,Set(PAGE_GROUP=${ARG1})
 same => n,Set(PAGE_CALLER=${CALLERID(num)})
 same => n,Set(PAGE_STARTED=0)
 same => n,Set(PAGE_AUTH=${DB_DELETE(page_auth/${PAGE_CALLER})})
 same => n,GotoIf($["${PAGE_AUTH}" = ""]?noauth)
 same => n,GotoIf($["${CUT(PAGE_AUTH,:,1)}" != "${PAGE_GROUP}"]?wronggroup)
 same => n,GotoIf($[${EPOCH} > ${CUT(PAGE_AUTH,:,2)}]?expired)
 ; Group membership comes from the generated [page-members] context (MEMBERS=1001-1002-...). The caller is
 ; removed below so nobody pages themselves.
 same => n,Set(MEMBERS=)
 same => n,Gosub(page-members,${PAGE_GROUP},1)
 same => n,GotoIf($["${MEMBERS}" = ""]?notargets)
 same => n,Set(TARGETS=)
 same => n,Set(IDX=1)
 same => n,While($[${IDX} <= ${FIELDQTY(MEMBERS,-)}])
 same => n,Gosub(sub-page-add,s,1(${CUT(MEMBERS,-,${IDX})}))
 same => n,Set(IDX=$[${IDX} + 1])
 same => n,EndWhile()
 same => n,GotoIf($["${TARGETS}" = ""]?notargets)
 same => n,Answer()
 ; Safety net: no single page may run longer than 5 minutes (forgotten/hot microphone).
 same => n,Set(TIMEOUT(absolute)=300)
 same => n,Set(PAGE_STARTED=1)
 same => n,UserEvent(PageStarted,Group: ${PAGE_GROUP},Caller: ${PAGE_CALLER})
 ; b(): Gosub on each outgoing leg (adds the paging headers); i: ignore forwards;
 ; q: no beep (no sound files installed); s: only ring devices that are NOT_INUSE.
 same => n,Page(${TARGETS},b(sub-page-prep^s^1(${PAGE_GROUP}))iqs,10)
 same => n,Return()
 same => n(noauth),Set(PAGE_DENY=noauth)
 same => n,Goto(denied)
 same => n(wronggroup),Set(PAGE_DENY=wronggroup)
 same => n,Goto(denied)
 same => n(expired),Set(PAGE_DENY=expired)
 same => n,Goto(denied)
 same => n(notargets),Set(PAGE_DENY=notargets)
 same => n(denied),NoOp(Page denied for ${PAGE_CALLER}: ${PAGE_DENY})
 same => n,UserEvent(PageDenied,Group: ${PAGE_GROUP},Caller: ${PAGE_CALLER},Reason: ${PAGE_DENY})
 same => n,Hangup(21)

; The operator hanging up (or Page() ending) lands here, because the channel is
; inside this context when it ends.
exten => h,1,ExecIf($["${PAGE_STARTED}" = "1"]?UserEvent(PageEnded,Group: ${PAGE_GROUP},Caller: ${PAGE_CALLER}))

; Append one member's endpoints (browser + phone) to TARGETS, skipping the caller.
[sub-page-add]
exten => s,1,ExecIf($["${ARG1}" = "${PAGE_CALLER}"]?Return())
 same => n,Gosub(sub-dialstr,s,1(${ARG1}))
 same => n,ExecIf($["${DIALSTR}" = ""]?Return())
 same => n,Set(TARGETS=${IF($["${TARGETS}" = ""]?:${TARGETS}&)}${DIALSTR})
 same => n,Return()

; Runs on each NEW outgoing page leg, before the INVITE is sent. Marks the
; INVITE as a page so clients may auto-answer it, and presents the group
; (700/701/702) as the caller: the From identity of an outbound PJSIP leg is the
; channel's connected-line, not CALLERID.
;   Call-Info: <sip:HOST>;answer-after=0     auto-answer marker (the ";" is escaped)
;   X-Paging-Call: true                       explicit paging marker the browser requires
;   P-Asserted-Identity: Paging System <...>
[sub-page-prep]
exten => s,1,NoOp(Preparing page leg for group ${ARG1})
 same => n,Set(CONNECTEDLINE(num)=${ARG1})
 same => n,Set(CONNECTEDLINE(name)=Paging)
 same => n,Set(PJSIP_HEADER(add,Call-Info)=<sip:${SERVER_HOSTNAME}>\;answer-after=0)
 same => n,Set(PJSIP_HEADER(add,X-Paging-Call)=true)
 same => n,Set(PJSIP_HEADER(add,P-Asserted-Identity)=Paging System <sip:paging@${SERVER_HOSTNAME}>)
 same => n,Return()

; -------------------------------------------------------------------- default
[default]
; Echo test
exten => 600,1,NoOp(Echo test from ${CALLERID(num)})
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Extensions (dial + page) and outbound routes are generated: see extensions_generated.conf.

; Invalid extension
exten => i,1,NoOp(Invalid destination ${INVALID_EXTEN} from ${CALLERID(num)})
 same => n,Hangup(1)

; Timeout / hangup handlers
exten => t,1,Hangup()
exten => h,1,NoOp(Call ended)

; ------------------------------------------------------------- outbound calls
; Called from the generated outbound routes: ARG1 route id, ARG2 number to dial (already stripped/prefixed),
; ARG3 trunks to try in order (a&b&c), ARG4 caller id set by the route, ARG5 1 = emergency route.
; An extension may dial out only if the generated [ext-outbound] context lists it (unless emergency).
[sub-outbound]
exten => s,1,NoOp(Outbound route ${ARG1}: ${CALLERID(num)} -> ${ARG2} via ${ARG3})
 same => n,Set(OB_CID=)
 same => n,GotoIf($["${ARG5}" = "1"]?go)
 same => n,GotoIf($[${DIALPLAN_EXISTS(ext-outbound,${CALLERID(num)},1)}]?perm:denied)
 same => n(perm),Gosub(ext-outbound,${CALLERID(num)},1)
 same => n(go),Set(NUM=${ARG2})
 same => n,Set(TRUNKS=${ARG3})
 same => n,Set(IDX=1)
 same => n,While($[${IDX} <= ${FIELDQTY(TRUNKS,&)}])
 same => n,Set(T=${CUT(TRUNKS,&,${IDX})})
 same => n,Set(IDX=$[${IDX} + 1])
 ; Skip a trunk that is at its channel limit (device_state_busy_at). A trunk that is down is not skipped
 ; here: Dial() fails immediately with CHANUNAVAIL for it and the loop moves on to the next trunk.
 same => n,GotoIf($["${DEVICE_STATE(PJSIP/${T})}" = "BUSY"]?next)
 ; Caller id: route, then extension, then trunk default.
 same => n,Gosub(trunk-meta,${T},1)
 same => n,Set(USECID=${IF($["${ARG4}" != ""]?${ARG4}:${IF($["${OB_CID}" != ""]?${OB_CID}:${TRUNK_CID})})})
 same => n,ExecIf($["${USECID}" != ""]?Set(CALLERID(num)=${USECID}))
 same => n,ExecIf($["${TRUNK_CIDNAME}" != ""]?Set(CALLERID(name)=${TRUNK_CIDNAME}))
 same => n,Dial(PJSIP/${NUM}@${T},60)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER" | "${DIALSTATUS}" = "BUSY" | "${DIALSTATUS}" = "CANCEL" | "${DIALSTATUS}" = "NOANSWER"]?done)
 same => n(next),NoOp(Trunk ${T} not used (${DIALSTATUS}); trying the next one)
 same => n,EndWhile()
 same => n,Hangup(34)
 same => n(done),Hangup()
 same => n(denied),NoOp(Outbound call from ${CALLERID(num)} refused: extension is not allowed to dial out)
 same => n,Hangup(21)

; ------------------------------------------------------------------- queues
; A queue member is the Local channel Local/<ext>@queue-member/n. It rings the extension's reachable browser and phone
; endpoints (skipping do not disturb). When nothing can be rung it ends at once, so the queue moves on to the next member.
[queue-member]
exten => _X.,1,NoOp(Queue member ${EXTEN} for ${CALLERID(num)})
 same => n,Gosub(sub-dialstr,s,1(${EXTEN},1))
 same => n,GotoIf($["${DIALSTR}" = ""]?none)
 same => n,Dial(${DIALSTR},60)
 same => n,Hangup()
 same => n(none),NoOp(${EXTEN} cannot be rung)
 same => n,Congestion(1)

; ---------------------------------------------------------------- generated part
#include "/pbx-generated/extensions_generated.conf"
