; Internal plain-WS endpoint. Nginx terminates browser-facing TLS on :443 and
; proxies wss://SERVER/ws to ws://ASTERISK_HOST:8088/ws. Do not expose 8088 to
; the LAN/Internet; restrict it with the host firewall (see DEPLOYMENT.md).
[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
servername = Asterisk
; The /ws endpoint is registered by res_http_websocket and consumed by
; res_pjsip_transport_websocket; no static content or TLS is served here.
