; Explicit RTP range (UDP). Must be allowed through the host firewall from the LAN.
[general]
rtpstart = ${RTP_START}
rtpend = ${RTP_END}
rtpchecksums = no
; Only accept RTP from the address learned from signalling/ICE (anti media hijack).
strictrtp = yes
; ICE is required for WebRTC clients.
icesupport = yes
; Only offer addresses on the networks clients really use (ICE_PERMIT, default LAN_SUBNET).
; Asterisk truncates its candidate list at 16 entries in unspecified order, so offering every
; interface (Docker bridges, VPNs...) makes the reachable one randomly disappear.
ice_deny = 0.0.0.0/0
${ICE_PERMIT_LINES}