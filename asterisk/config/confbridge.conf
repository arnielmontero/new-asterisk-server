; Used by Page() (app_page builds a ConfBridge with the caller as speaker and
; every paged device as a muted participant). Profiles are tuned in Phase 2.
[general]

[default_user]
type = user

[default_bridge]
type = bridge

; Conference rooms (generated into the dialplan, see render.js). Every room starts from these profiles; its PINs, member
; limit and mute-on-join are applied per call with CONFBRIDGE(). No sound files are installed, so announcements are
; switched off and the keys below act silently; the web page shows who is in a room and whether they are muted.
[c-bridge]
type = bridge
mixing_interval = 20

[c-user]
type = user
quiet = yes
announce_join_leave = no
announce_user_count = no
announce_user_count_all = no
announce_only_user = no
music_on_hold_when_empty = no
talk_detection_events = yes
dtmf_passthrough = no

[c-menu]
type = menu
1 = toggle_mute
2 = admin_toggle_conference_lock
3 = admin_kick_last
4 = decrease_listening_volume
6 = increase_listening_volume
7 = decrease_talking_volume
9 = increase_talking_volume
